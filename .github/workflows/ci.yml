name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: node --test tests/algorithm.test.js

      - name: Check source file size
        run: |
          SIZE=$(wc -c < pixel-shield.js)
          echo "pixel-shield.js: ${SIZE} bytes ($(echo "scale=1; $SIZE/1024" | bc)KB)"
          # Warn if source exceeds 20KB (minified target is <10KB)
          if [ "$SIZE" -gt 20480 ]; then
            echo "WARNING: Source file is over 20KB — check for accidental bloat"
            exit 1
          fi
